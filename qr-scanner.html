<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #050d0c, #0f261f 40%, #040805);
    }
    #camera-box {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    #canvas { display: none; }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .scan-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 290px);
      height: min(72vw, 290px);
      transform: translate(-50%, -50%);
      border: 3px solid #47ff9f;
      background: rgba(71,255,159,0.06);
      box-shadow: 0 0 20px rgba(71,255,159,0.28);
      border-radius: 10px;
    }
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #47ff9f;
      border-style: solid;
    }
    .corner.tl { top: -3px; left: -3px; border-width: 4px 0 0 4px; border-radius: 8px 0 0 0; }
    .corner.tr { top: -3px; right: -3px; border-width: 4px 4px 0 0; border-radius: 0 8px 0 0; }
    .corner.bl { bottom: -3px; left: -3px; border-width: 0 0 4px 4px; border-radius: 0 0 0 8px; }
    .corner.br { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; border-radius: 0 0 8px 0; }
    .header {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.62);
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(71,255,159,0.3);
      font-size: 15px;
      z-index: 3;
      text-align: center;
      white-space: nowrap;
    }
    .footer {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #dfffe8;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(71,255,159,0.25);
      font-size: 14px;
      text-align: center;
      z-index: 3;
      max-width: 90%;
    }
    .video-panel {
      position: absolute;
      inset: 0;
      display: none;
      background: rgba(0,0,0,0.96);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .video-panel.active { display: flex; }
    .video-card {
      width: min(900px, 100%);
      background: #0b120d;
      border-radius: 18px;
      border: 1px solid rgba(71,255,159,0.3);
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      background: #000;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    #playBtn { background: #47ff9f; color: #02170d; }
    #closeBtn { background: #ff6464; color: white; }
    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 100, 100, 0.96);
      color: white;
      padding: 18px 24px;
      border-radius: 12px;
      display: none;
      max-width: 90%;
      z-index: 20;
      text-align: center;
    }
    .message.show { display: block; }
  </style>
</head>
<body>
  <div id="camera-box">
    <video id="camera-feed" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div class="header">QR Scanner</div>
    <div class="overlay">
      <div class="scan-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
    </div>
    <div class="footer">Point the camera at the QR code to open the video.</div>

    <div id="message" class="message">Camera access required.</div>

    <div id="video-panel" class="video-panel">
      <div class="video-card">
        <video id="video" controls playsinline webkit-playsinline></video>
        <div class="controls">
          <button id="playBtn">▶ Play</button>
          <button id="closeBtn">✕ Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const message = document.getElementById('message');
    const videoPanel = document.getElementById('video-panel');
    const playback = document.getElementById('video');
    const playBtn = document.getElementById('playBtn');
    const closeBtn = document.getElementById('closeBtn');

    let lastCode = null;
    let scanning = true;

    function showMessage(text, timeout = 3000) {
      message.textContent = text;
      message.classList.add('show');
      if (timeout) {
        setTimeout(() => message.classList.remove('show'), timeout);
      }
    }

    function setCanvasForVideo() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          setCanvasForVideo();
          scanLoop();
        };
      } catch (e) {
        showMessage('Camera access is blocked. Please allow camera access and reload the page.', 5000);
      }
    }

    function parseVideoUrl(raw) {
      let url = raw.trim();
      if (!url) return null;
      if (url.includes('video=')) {
        return decodeURIComponent(url.split('video=')[1].split('&')[0]);
      }
      if (url.includes('.mp4') || url.includes('.webm') || url.includes('.mov')) {
        return url;
      }
      if (url.includes('github.com')) {
        return './video.mp4';
      }
      return null;
    }

    function handleCode(data) {
      const url = parseVideoUrl(data);
      if (!url) {
        showMessage('The QR code was read, but it does not contain a valid video link.', 4000);
        return;
      }

      scanning = false;
      videoPanel.classList.add('active');
      playback.src = url;
      playback.load();
      showMessage('QR code found. Video ready.', 1800);
    }

    function scanLoop() {
      if (!scanning || video.readyState < 2) {
        requestAnimationFrame(scanLoop);
        return;
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code && code.data && code.data !== lastCode) {
        lastCode = code.data;
        handleCode(code.data);
      }

      requestAnimationFrame(scanLoop);
    }

    playBtn.addEventListener('click', async () => {
      try {
        await playback.play();
      } catch (e) {
        showMessage('Tap the video player to begin playback.', 2500);
      }
    });

    closeBtn.addEventListener('click', () => {
      scanning = true;
      lastCode = null;
      playback.pause();
      playback.currentTime = 0;
      playback.src = '';
      videoPanel.classList.remove('active');
      showMessage('Scanner ready again.', 1800);
    });

    startCamera();
  </script>
</body>
</html>
