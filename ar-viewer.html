<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    body { background: radial-gradient(circle at top, #123027, #030d0a 45%, #000 100%); }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .scan-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(74vw, 290px);
      height: min(74vw, 290px);
      transform: translate(-50%, -50%);
      border: 3px solid #73ffb5;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(115,255,181,0.22);
      background: rgba(115,255,181,0.05);
    }
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #73ffb5;
      border-style: solid;
    }
    .corner.tl { left: -3px; top: -3px; border-width: 4px 0 0 4px; border-radius: 8px 0 0 0; }
    .corner.tr { right: -3px; top: -3px; border-width: 4px 4px 0 0; border-radius: 0 8px 0 0; }
    .corner.bl { left: -3px; bottom: -3px; border-width: 0 0 4px 4px; border-radius: 0 0 0 8px; }
    .corner.br { right: -3px; bottom: -3px; border-width: 0 4px 4px 0; border-radius: 0 0 8px 0; }
    .header, .footer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #f2fff8;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(115,255,181,0.2);
      z-index: 3;
      text-align: center;
      font-size: 14px;
    }
    .header { top: 18px; }
    .footer { bottom: 28px; max-width: 88%; }
    .video-sheet {
      position: absolute;
      inset: 0;
      display: none;
      background: rgba(0,0,0,0.94);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .video-sheet.active { display: flex; }
    .video-card {
      width: min(960px, 100%);
      background: #0a140f;
      border-radius: 18px;
      border: 1px solid rgba(115,255,181,0.28);
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    #playBtn { background: #73ffb5; color: #04170d; }
    #closeBtn { background: #ff5a5a; color: white; }
    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 24px;
      background: rgba(255,90,90,0.95);
      border-radius: 12px;
      display: none;
      z-index: 25;
      text-align: center;
      max-width: 90%;
    }
    .message.show { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <video id="camera" playsinline autoplay muted></video>
    <div class="header">AR Video Scanner</div>
    <div class="scan-box">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
    <div class="footer">Scan the QR code to reveal the video</div>

    <div id="message" class="message">Camera required.</div>

    <div id="videoSheet" class="video-sheet">
      <div class="video-card">
        <video id="video" controls playsinline webkit-playsinline></video>
        <div class="controls">
          <button id="playBtn">▶ Play</button>
          <button id="closeBtn">✕ Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const camera = document.getElementById('camera');
    const video = document.getElementById('video');
    const videoSheet = document.getElementById('videoSheet');
    const message = document.getElementById('message');
    const playBtn = document.getElementById('playBtn');
    const closeBtn = document.getElementById('closeBtn');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let lastCode = null;
    let scanning = true;
    const videoSource = './video.mp4';

    function showMessage(text, timeout = 3200) {
      message.textContent = text;
      message.classList.add('show');
      setTimeout(() => message.classList.remove('show'), timeout);
    }

    function parseVideoUrl(raw) {
      const text = String(raw || '').trim();
      if (!text) return null;
      if (text.includes('video=')) return decodeURIComponent(text.split('video=')[1].split('&')[0]);
      if (/(?:\.mp4|\.webm|\.mov)(?:\?|$)/i.test(text)) return text;
      if (text.includes('github.com') || text.includes('raw.githubusercontent')) return videoSource;
      return null;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        camera.srcObject = stream;
        camera.onloadedmetadata = () => {
          canvas.width = camera.videoWidth || 640;
          canvas.height = camera.videoHeight || 480;
          scanLoop();
        };
      } catch (err) {
        showMessage('Camera access denied. Please allow permission to use the AR viewer.', 5000);
      }
    }

    function handleQR(data) {
      const url = parseVideoUrl(data);
      if (!url) {
        showMessage('The QR code was detected, but it does not point to a valid video.', 4000);
        return;
      }
      scanning = false;
      videoSheet.classList.add('active');
      video.src = url;
      video.load();
      showMessage('QR code matched video.', 2000);
    }

    function scanLoop() {
      if (!scanning || camera.readyState < 2) {
        requestAnimationFrame(scanLoop);
        return;
      }
      ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data && code.data !== lastCode) {
        lastCode = code.data;
        handleQR(code.data);
      }
      requestAnimationFrame(scanLoop);
    }

    playBtn.addEventListener('click', async () => {
      try { await video.play(); } catch (err) { showMessage('Tap the video controls to start playback.', 2200); }
    });

    closeBtn.addEventListener('click', () => {
      scanning = true;
      lastCode = null;
      video.pause();
      video.currentTime = 0;
      video.src = '';
      videoSheet.classList.remove('active');
      showMessage('Scanner ready again.', 1800);
    });

    startCamera();
  </script>
</body>
</html>
