<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Video Me - Scan QR Code</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: Arial, sans-serif; }
    
    /* AR Scene */
    #arScene { width: 100%; height: 100%; }
    
    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-size: 16px;
      text-align: center;
      padding: 24px;
    }
    
    #loading.hidden { display: none; }
    
    #loading p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.7;
    }
    
    /* Hint text */
    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #47ff9f;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(71,255,159,0.3);
      font-size: 14px;
      z-index: 100;
      text-align: center;
      max-width: 90%;
    }
    
    /* Video player overlay */
    #videoOverlay {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(0,0,0,0.98);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    
    #videoOverlay.active {
      display: flex;
    }
    
    .videoCard {
      width: min(960px, 100%);
      background: #0a150d;
      border-radius: 18px;
      border: 1px solid rgba(71,255,159,0.3);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    .videoCard video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }
    
    .videoControls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
    }
    
    .videoControls button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    
    #playVideoBtn {
      background: #47ff9f;
      color: #04170d;
    }
    
    #closeVideoBtn {
      background: #ff5a5a;
      color: #fff;
    }
    
    /* Navigation bar */
    #navBar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(71,255,159,0.25);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      z-index: 101;
    }
    
    #navBar a {
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <!-- AR Scene with pattern marker -->
  <a-scene
    id="arScene"
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: mediump;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="15000">
      <video
        id="arVideo"
        src="./video.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- QR Code Image Marker -->
    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/hycentude89-tech/ar-video-me/main/QR-code.png"
      emitevents="true"
      smooth="true"
      smoothCount="5"
      smoothTolerance=".01"
      smoothThreshold="5">

      <a-video
        id="videoPlane"
        src="#arVideo"
        width="1.6"
        height="0.9"
        position="0 0.05 0"
        rotation="-90 0 0"
        material="shader: flat; side: double;">
      </a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Loading Screen -->
  <div id="loading">
    <p>🎬 AR Video Me</p>
    <p>Starting camera...</p>
    <p style="font-size: 12px; margin-top: 12px;">Allow camera permission when asked</p>
  </div>

  <!-- Hint Text -->
  <div id="hint">📷 Point camera at the QR code to start</div>

  <!-- Navigation -->
  <div id="navBar">
    <a href="video-player.html">Video Player</a>
    <a href="qr-scanner.html">QR Scanner</a>
    <a href="qr-image.html">QR Image</a>
  </div>

  <!-- Video Player Overlay -->
  <div id="videoOverlay">
    <div class="videoCard">
      <video id="displayVideo" controls playsinline webkit-playsinline preload="auto"></video>
      <div class="videoControls">
        <button id="playVideoBtn">▶ Play</button>
        <button id="closeVideoBtn">✕ Close</button>
      </div>
    </div>
  </div>

  <script>
    const arVideo = document.getElementById('arVideo');
    const marker = document.querySelector('a-marker');
    const loading = document.getElementById('loading');
    const hint = document.getElementById('hint');
    const videoOverlay = document.getElementById('videoOverlay');
    const displayVideo = document.getElementById('displayVideo');
    const playVideoBtn = document.getElementById('playVideoBtn');
    const closeVideoBtn = document.getElementById('closeVideoBtn');

    let isMarkerFound = false;

    function hideLoading() {
      setTimeout(() => {
        loading.classList.add('hidden');
      }, 800);
    }

    function showVideo() {
      isMarkerFound = true;
      hint.textContent = '✓ QR code detected! Tap Play to watch.';
      
      displayVideo.src = './video.mp4';
      displayVideo.load();
      videoOverlay.classList.add('active');
    }

    function closeVideo() {
      isMarkerFound = false;
      videoOverlay.classList.remove('active');
      displayVideo.pause();
      displayVideo.currentTime = 0;
      displayVideo.src = '';
      arVideo.pause();
      arVideo.currentTime = 0;
      hint.textContent = '📷 Point camera at the QR code to start';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');

      scene.addEventListener('loaded', hideLoading);

      marker.addEventListener('markerFound', async () => {
        if (!isMarkerFound) {
          showVideo();
          try {
            arVideo.muted = true;
            arVideo.setAttribute('muted', '');
            arVideo.setAttribute('playsinline', '');
            await arVideo.play();
          } catch (e) {
            console.log('Video play:', e);
          }
        }
      });

      marker.addEventListener('markerLost', () => {
        closeVideo();
      });

      // User gesture for mobile playback unlock
      document.body.addEventListener('touchstart', async () => {
        try {
          arVideo.muted = true;
          await arVideo.play();
          arVideo.pause();
          arVideo.currentTime = 0;
        } catch (e) {}
      }, { once: true });
    });

    playVideoBtn.addEventListener('click', async () => {
      try {
        await displayVideo.play();
      } catch (err) {
        hint.textContent = 'Tap the video controls to start playback.';
      }
    });

    closeVideoBtn.addEventListener('click', closeVideo);
  </script>
</body>
</html>
