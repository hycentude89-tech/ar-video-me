<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Video Me | Direct QR + Video</title>
    <style>
        :root {
            --bg1: #06130d;
            --bg2: #0e2a22;
            --panel: rgba(15, 31, 27, 0.85);
            --accent: #7af7c6;
            --accent2: #3fe0a0;
            --text: #eefdf7;
            --muted: #c3ebdb;
            --line: rgba(122,247,198,0.2);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #15372d 0%, var(--bg1) 35%, #030b08 100%);
            color: var(--text);
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .float-panel {
            width: min(980px, 100%);
            background: rgba(11, 22, 20, 0.78);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 28px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(122,247,198,0.1);
            border: 1px solid rgba(122,247,198,0.25);
            color: var(--accent);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
        }

        h1 {
            margin: 12px 0 8px;
            font-size: clamp(2.1rem, 4vw, 3.2rem);
            letter-spacing: -0.04em;
        }

        .sub {
            margin: 0;
            color: var(--muted);
            font-size: 1.03rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 18px;
        }

        .card {
            background: linear-gradient(180deg, rgba(16, 35, 30, 0.9), rgba(10, 18, 17, 0.9));
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 18px;
        }

        .card h2 {
            margin: 0 0 16px;
            color: var(--accent2);
        }

        .qr-wrap {
            background: white;
            border-radius: 18px;
            padding: 16px;
            display: grid;
            place-items: center;
            margin-bottom: 16px;
            border: 1px solid rgba(122,247,198,0.2);
        }

        .qr-wrap img {
            display: block;
            width: min(100%, 260px);
            height: auto;
            border-radius: 12px;
        }

        .video-wrap {
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--line);
            margin-bottom: 16px;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 340px;
            background: #000;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 145px;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #02130e;
        }

        .btn.secondary {
            border: 1px solid rgba(255,255,255,0.25);
            color: var(--text);
            background: transparent;
        }

        .info {
            text-align: center;
            margin-top: 22px;
            border-top: 1px solid var(--line);
            padding-top: 18px;
            color: var(--muted);
            line-height: 1.7;
        }

        .info a {
            color: var(--accent);
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="float-panel">
        <div class="header">
            <span class="badge">AR Video Me</span>
            <h1>Scan to Open</h1>
            <p class="sub">Direct QR code + video access on a floating landing page.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h2>QR Code</h2>
                <div class="qr-wrap">
                    <img src="QR-code.png" alt="AR Video QR Code">
                </div>
                <div class="actions">
                    <a class="btn primary" href="QR-code.png" target="_blank" rel="noopener">Open QR</a>
                    <a class="btn secondary" href="https://hycentude89-tech.github.io/ar-video-me/QR-code.png" target="_blank" rel="noopener">Direct Link</a>
                </div>
            </div>

            <div class="card">
                <h2>Video</h2>
                <div class="video-wrap">
                    <video controls playsinline preload="metadata" src="video.mp4"></video>
                </div>
                <div class="actions">
                    <a class="btn primary" href="video.mp4" target="_blank" rel="noopener">Open Video</a>
                    <a class="btn secondary" href="https://hycentude89-tech.github.io/ar-video-me/video.mp4" target="_blank" rel="noopener">Direct Link</a>
                </div>
            </div>
        </div>

        <div class="info">
            <strong>Direct public links:</strong><br>
            QR: <a href="https://hycentude89-tech.github.io/ar-video-me/QR-code.png" target="_blank" rel="noopener">https://hycentude89-tech.github.io/ar-video-me/QR-code.png</a><br>
            Video: <a href="https://hycentude89-tech.github.io/ar-video-me/video.mp4" target="_blank" rel="noopener">https://hycentude89-tech.github.io/ar-video-me/video.mp4</a>
        </div>
    </div>
</body>
</html>
