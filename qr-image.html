<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Image Video Loader</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050d0c;
      color: white;
      font-family: Arial, sans-serif;
    }
    .wrap {
      width: min(900px, 90vw);
      background: rgba(14, 25, 22, 0.9);
      border: 1px solid rgba(71,255,159,0.25);
      border-radius: 20px;
      padding: 24px;
    }
    img {
      display: block;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 18px;
      background: #000;
      border-radius: 14px;
    }
    .status {
      font-size: 18px;
      margin-bottom: 12px;
      color: #dfeee6;
    }
    .data {
      word-break: break-all;
      color: #47ff9f;
      font-weight: 700;
      margin-bottom: 18px;
    }
    video {
      width: 100%;
      display: block;
      border-radius: 12px;
      background: #000;
    }
    button {
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #47ff9f;
      color: #02170d;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img id="qrImage" src="QR-code.png" alt="QR code">

    <div id="status" class="status">Scanning QR image...</div>
    <div id="data" class="data">Waiting...</div>

    <video id="video" controls playsinline preload="auto"></video>
    <button id="playBtn">Play Video</button>
  </div>

  <script>
    const repoUrl = "https://github.com/hycentude89-tech/ar-video-me";
    const videoUrl = "https://raw.githubusercontent.com/hycentude89-tech/ar-video-me/main/video.mp4";

    function resolveScanTarget(raw) {
      const value = String(raw || "").trim();
      if (!value) return null;

      if (value === repoUrl || value.includes("github.com/hycentude89-tech/ar-video-me")) {
        return videoUrl;
      }

      if (value.includes("raw.githubusercontent.com/hycentude89-tech/ar-video-me/main/video.mp4")) {
        return value;
      }

      if (/(?:\.mp4|\.webm|\.mov)(?:\?|$)/i.test(value)) {
        return value;
      }

      return null;
    }

    function decodeImage() {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (!code || !code.data) {
          document.getElementById('status').textContent = 'No QR code detected.';
          document.getElementById('data').textContent = 'Please use a clearer QR image.';
          return;
        }

        const target = resolveScanTarget(code.data);
        document.getElementById('data').textContent = code.data;

        if (!target) {
          document.getElementById('status').textContent = 'QR found, but it is not a supported video link.';
          return;
        }

        document.getElementById('status').textContent = 'QR code decoded successfully.';
        const video = document.getElementById('video');
        video.src = target;
        video.load();
        video.play().catch(() => {});
      };

      img.onerror = () => {
        document.getElementById('status').textContent = 'Image failed to load.';
      };

      img.src = 'QR-code.png';
    }

    document.getElementById('playBtn').addEventListener('click', async () => {
      const video = document.getElementById('video');
      try { await video.play(); } catch (e) {}
    });

    decodeImage();
  </script>
</body>
</html>
