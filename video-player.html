<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Video Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #010806;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .frame {
      width: min(980px, 100%);
      background: rgba(10, 18, 15, 0.94);
      border: 1px solid rgba(71,255,159,0.25);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.6rem); }
    .nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav a {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.02);
    }
    .content { padding: 20px; }
    .video-wrap {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      max-height: 72vh;
      background: #000;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      padding-top: 18px;
    }
    button {
      border: 0;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }
    #playBtn { background: #47ff9f; color: #04170d; }
    #reloadBtn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .status {
      margin-top: 16px;
      text-align: center;
      color: #d8fff0;
      min-height: 24px;
      font-size: 0.96rem;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <h1>Video Player</h1>
      <div class="nav">
        <a href="index.html">Home</a>
        <a href="qr-scanner.html">QR Scanner</a>
        <a href="qr-image.html">QR Image</a>
      </div>
    </div>

    <div class="content">
      <div class="video-wrap">
        <video id="video" controls playsinline webkit-playsinline preload="auto" src="./video.mp4"></video>
      </div>
      <div class="controls">
        <button id="playBtn">▶ Play</button>
        <button id="reloadBtn">↻ Reload</button>
      </div>
      <div id="status" class="status">Ready to play the AR video.</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');
    const reloadBtn = document.getElementById('reloadBtn');

    playBtn.addEventListener('click', async () => {
      try {
        await video.play();
        status.textContent = 'Playing...';
      } catch (err) {
        status.textContent = 'Tap the video controls to start playback.';
      }
    });

    reloadBtn.addEventListener('click', () => {
      video.pause();
      video.currentTime = 0;
      video.src = './video.mp4';
      video.load();
      status.textContent = 'Video reloaded.';
    });

    video.addEventListener('loadedmetadata', () => {
      status.textContent = 'Video ready.';
    });

    video.addEventListener('ended', () => { status.textContent = 'Playback finished.'; });
  </script>
</body>
</html>
