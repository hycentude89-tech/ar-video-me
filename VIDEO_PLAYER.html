<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Video Me - Play Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video controls autoplay playsinline>
    <source src="https://raw.githubusercontent.com/hycentude89-tech/ar-video-me/main/video.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <script>
    // Auto-play on load
    document.querySelector('video').play().catch(err => console.log('Autoplay prevented by browser'));
  </script>
</body>
</html>
