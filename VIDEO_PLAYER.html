<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Video Me</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: min(90vw, 900px);
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AR Video Me</h1>
    <video controls autoplay playsinline>
      <source src="https://raw.githubusercontent.com/hycentude89-tech/ar-video-me/main/video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>
</body>
</html>
